# HexStrike Tor Proxy Configuration
# Ensures all network requests go through Tor for anonymity

[network]
# Tor SOCKS5 proxy settings
TOR_ENABLED=true
TOR_HOST=th3-tor
TOR_PORT=9050
TOR_CONTROL_PORT=9051

# Proxy URLs
SOCKS5_PROXY=socks5://th3-tor:9050
HTTP_PROXY=socks5://th3-tor:9050
HTTPS_PROXY=socks5://th3-tor:9050

# Circuit isolation
USE_ISOLATED_CIRCUITS=true
NEW_CIRCUIT_PER_REQUEST=false

# Connection timeouts
CONNECT_TIMEOUT=30
READ_TIMEOUT=60

[security]
# Anonymity settings
ANONYMITY_ENABLED=true
STRIP_HEADERS=true
REMOVE_IDENTIFYING_HEADERS=true

# Headers to remove
REMOVE_HEADERS=X-Forwarded-For,X-Real-IP,User-Agent,Accept-Language,Accept-Encoding

# SSL/TLS
VERIFY_SSL=true
TLS_VERSION=1.3

[logging]
# Log anonymity actions
LOG_TOR_CONNECTIONS=true
LOG_PROXY_USAGE=true
DEBUG_MODE=false

[application]
# HexStrike specific settings
WORKSPACE=/workspace
VAULT_PATH=/vault
AUTO_REPORT_GENERATION=true
REPORT_DESTINATION=/vault/_BRAIN/hexstrike_reports

# Integration
CLAUDE_INTEGRATION=enabled
HACKERGPT_HOST=th3-hackergpt

[startup]
# Initialization
INIT_SCRIPT=/tor_hexstrike_init.sh
WAIT_FOR_TOR=true
MAX_RETRY_ATTEMPTS=30
RETRY_DELAY=1

# Health checks
HEALTH_CHECK_INTERVAL=30
TOR_HEALTH_CHECK=true
