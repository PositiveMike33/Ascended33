## Privoxy Configuration for TOR Integration
## SOCKS5 to HTTP Proxy Bridge

# Basic Setup
user-manual /usr/share/doc/privoxy/user-manual
confdir /etc/privoxy
logdir /var/log/privoxy
actionsfile match-all.action # Actions file
actionsfile default.action   # Default actions file
actionsfile user.action      # User custom actions
filterfile default.filter    # Filters file
filterfile user.filter       # User custom filters

# Port and Binding
listen-address  0.0.0.0:8118
toggle  1
enable-toggle  1
enable-remote-toggle  0
enable-edit-actions 0

# Forwarding to TOR
forward-socks5t    .           th3-tor:9050 .

# Performance Settings
keep-alive-timeout 300
client-header-order SORT

# Security
permit-access  0.0.0.0/0 :8118

# Logging
logfile privoxy.log
log-file-limit 5242880

# Performance Tuning
buffer-limit 4096
max-client-connections 256
