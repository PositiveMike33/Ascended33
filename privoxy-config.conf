# Privoxy Configuration
# Routes HTTP/HTTPS through Tor SOCKS5
# Handles DNS properly to avoid leaks

# Listen address
listen-address  127.0.0.1:8118
listen-address  [::1]:8118

# Allow LAN access (for Docker network)
listen-address  0.0.0.0:8118

# Tor SOCKS5 forwarding
forward-socks5   /              th3-tor:9050    .

# Forward all .onion traffic through Tor
forward         .onion/         th3-tor:9050

# DNS handling
#  - privoxy doesn't do DNS lookups itself
#  - instead forwards CONNECT requests to Tor
#  - Tor handles DNS resolution securely

# Don't change default user agent
#split-large-forms 0
#connect-timeout 20

# Activity logging
#logfile logfile
#debug     1  # Show request headers
#debug     2  # Show response headers

# Miscellaneous
#show-on-error 1
#temporary-email-addresses 0

# Filters
filterfile default.filter
filterfile user.filter

# Actions
actionsfile match-all.action
actionsfile default.action
actionsfile user.action
